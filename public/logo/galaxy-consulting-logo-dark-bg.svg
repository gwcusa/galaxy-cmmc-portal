<svg width="400" height="80" viewBox="0 0 400 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: Galaxy orbit rings + star core -->
  <!-- Outer orbit ring -->
  <ellipse cx="40" cy="40" rx="36" ry="16" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" transform="rotate(-25 40 40)"/>
  <!-- Middle orbit ring -->
  <ellipse cx="40" cy="40" rx="26" ry="11" stroke="#C0C8D8" stroke-width="1.2" opacity="0.5" transform="rotate(20 40 40)"/>
  <!-- Inner orbit ring -->
  <ellipse cx="40" cy="40" rx="16" ry="7" stroke="#4A90D9" stroke-width="1" opacity="0.7" transform="rotate(-10 40 40)"/>
  <!-- Star/planet core -->
  <circle cx="40" cy="40" r="7" fill="#2E6DB4"/>
  <circle cx="40" cy="40" r="4.5" fill="#4A90D9"/>
  <circle cx="40" cy="40" r="2" fill="#FFFFFF" opacity="0.9"/>
  <!-- Orbiting dots -->
  <circle cx="40" cy="40" r="3" fill="#C0C8D8" transform="rotate(-25 40 40) translate(36 0)"/>
  <circle cx="40" cy="40" r="2.5" fill="#4A90D9" transform="rotate(20 40 40) translate(-26 0)"/>
  <!-- Accent stars -->
  <circle cx="14" cy="18" r="1.2" fill="#C0C8D8" opacity="0.8"/>
  <circle cx="66" cy="62" r="1" fill="#4A90D9" opacity="0.7"/>
  <circle cx="70" cy="22" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="10" cy="58" r="0.8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="58" cy="12" r="1" fill="#C0C8D8" opacity="0.6"/>

  <!-- Text: Galaxy Consulting -->
  <text x="92" y="37" font-family="Barlow, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="3" text-transform="uppercase" fill="#FFFFFF" style="text-transform:uppercase">GALAXY CONSULTING</text>
  <!-- Subtext: LLC · Our Mission Is Your Success -->
  <text x="92" y="54" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="10" letter-spacing="3.5" fill="#C0C8D8" style="text-transform:uppercase">LLC  ·  OUR MISSION IS YOUR SUCCESS</text>
</svg>
